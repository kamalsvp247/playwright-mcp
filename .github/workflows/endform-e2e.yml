name: Run end to end tests with endform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write # required for authentication with Endform

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: true

      - name: Ensure Playwright Test runner is installed
        run: |
          echo "Installing @playwright/test to satisfy Endform runtime"
          npm install --no-audit --no-fund @playwright/test@^1.51.1

      - name: Wait for Vercel deployment
        uses: endformdev/actions/run-with-vercel-deployment@main
        with:
          project-name: playwright-mcp
          set-url-env-var: BASE_URL

      - name: Run end to end tests with endform
        working-directory: .
        run: |
          npx endform@latest test
